[project]
name = "parlivo-ai"
version = "0.0.0"
description = "AI service: summaries, RAG, extraction and analytics (FastAPI)"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "pydantic==2.14.1",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "nats-py==2.16.0",
]

[project.scripts]
parlivo-ai = "parlivo_ai.main:main"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "parlivo_ai"

[tool.ruff]
extend = "../../packages/config/python/ruff.toml"

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
