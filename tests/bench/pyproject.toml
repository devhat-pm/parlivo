[project]
name = "parlivo-bench"
version = "0.0.0"
description = "Streams-per-GPU and glass-to-ear latency benchmarks (phase 1 gate)"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "aiohttp==3.14.5",
    "livekit==1.2.1",
    "livekit-api==1.2.2",
    "numpy==2.5.4",
    "parlivo-schemas",
    "pydantic==2.14.1",
]

[project.scripts]
parlivo-bench = "parlivo_bench.main:main"

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "parlivo_bench"

[tool.uv.sources]
parlivo-schemas = { path = "../../packages/schemas/python", editable = true }

[tool.ruff]
extend = "../../packages/config/python/ruff.toml"

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
