[project]
name = "parlivo-bench"
version = "0.0.0"
description = "Streams-per-GPU and glass-to-ear latency benchmarks (phase 1 gate)"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "pydantic==2.14.1",
]

[project.scripts]
parlivo-bench = "parlivo_bench.main:main"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "parlivo_bench"

[tool.ruff]
extend = "../../packages/config/python/ruff.toml"

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
