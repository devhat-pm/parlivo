# Local CPU-only infrastructure for Parlivo (ARCHITECTURE.md section 8).
# Start: pnpm dev:infra    Stop: pnpm dev:infra:down    Ports: infra/dev/README.md
# Image versions are pinned in docs/versions.md.
name: parlivo-dev

services:
  livekit:
    image: livekit/livekit-server:v1.13.10
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    # Host networking: WebRTC media through Docker's port forwarding is unreliable (ICE
    # connects but DTLS times out on Docker Desktop for macOS). On Docker Desktop, enable
    # Settings > Resources > Network > "Enable host networking".
    network_mode: host
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7880/ | grep -q OK"]
      interval: 5s
      timeout: 3s
      retries: 20

  coturn:
    image: coturn/coturn:4.18.0
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --lt-cred-mech
      - --user=parlivo:parlivo-dev-turn
      - --realm=parlivo.dev
      - --external-ip=127.0.0.1
      - --no-tls
      - --prometheus
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    healthcheck:
      # The image has no curl or wget; a STUN binding request proves the server answers.
      test: ["CMD", "turnutils_stunclient", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: pgvector/pgvector:0.8.7-pg18
    environment:
      POSTGRES_USER: parlivo
      POSTGRES_PASSWORD: parlivo
      POSTGRES_DB: parlivo
    ports:
      - "${PARLIVO_PG_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parlivo -d parlivo"]
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9.1.2-alpine
    ports:
      - "${PARLIVO_VALKEY_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.15.1-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:8222/healthz?js-enabled-only=true'"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.15.1
    # Host networking so it can scrape the agent, which runs on the host (localhost:9464).
    network_mode: host
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.listen-address=:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:13.2.4
    network_mode: host
    environment:
      GF_SERVER_HTTP_PORT: "3300"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3300/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  nats-data:
