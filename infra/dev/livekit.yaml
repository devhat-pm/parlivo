# LiveKit server config for local development only. Never use these keys anywhere else.
port: 7880
bind_addresses:
  - 0.0.0.0
log_level: info
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50060
  # Browsers run on the host and reach the container through published ports.
  use_external_ip: false
  node_ip: 127.0.0.1
  turn_servers:
    - host: 127.0.0.1
      port: 3478
      protocol: udp
      username: parlivo
      credential: parlivo-dev-turn
    - host: 127.0.0.1
      port: 3478
      protocol: tcp
      username: parlivo
      credential: parlivo-dev-turn
keys:
  # api key: api secret (LiveKit requires secrets of at least 32 characters)
  devkey: parlivo-dev-secret-0123456789abcdef
room:
  empty_timeout: 300
