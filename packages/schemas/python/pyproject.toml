[project]
name = "parlivo-schemas"
version = "0.0.0"
description = "Pydantic message schemas shared by Parlivo Python services (mirrors packages/schemas Zod)"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "pydantic==2.14.1",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "parlivo_schemas"

[tool.ruff]
extend = "../../config/python/ruff.toml"

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
