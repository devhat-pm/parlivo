# Template for Python projects. Copy to services/<name>/pyproject.toml and replace
# __NAME__ (e.g. stt) and __PACKAGE__ (e.g. parlivo_stt). Versions are pinned exactly;
# see docs/versions.md.
[project]
name = "parlivo-__NAME__"
version = "0.0.0"
description = "__DESCRIPTION__"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "pydantic==2.14.1",
]

[project.scripts]
parlivo-__NAME__ = "__PACKAGE__.main:main"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[build-system]
requires = ["uv_build==0.13.5"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "__PACKAGE__"

[tool.ruff]
extend = "../../packages/config/python/ruff.toml"

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
