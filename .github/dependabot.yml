# Keeps pinned versions current (CLAUDE.md, Versions policy). Every bump must also
# update docs/versions.md in the same PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"] }
    ignore:
      # typescript-eslint supports TypeScript <6.1 only (docs/versions.md).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node tracks the Node runtime line (24), not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: uv
    directories:
      - /services/agent
      - /services/stt
      - /services/translate
      - /services/tts
      - /services/ai
      - /tests/bench
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }
    ignore:
      # torch is pinned exactly by vllm (translate) and chatterbox-tts (tts); bump it by hand.
      - dependency-name: torch
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
