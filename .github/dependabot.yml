# Keeps pinned versions current (CLAUDE.md, Versions policy). Every bump must also
# update docs/versions.md in the same PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"] }
  - package-ecosystem: uv
    directories:
      - /services/agent
      - /services/stt
      - /services/translate
      - /services/tts
      - /services/ai
      - /tests/bench
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
